# 2026-10-20: ОТКЛЮЧЕНО — правило давало чистый шум. Паттерн `(K[0-9]{3}[A-Za-z0-9]{28,})`
# ловит любой `K`+3 цифры+28 символов внутри base64/прокси-URI/рандома, а entropy 3.5 не
# защищает, потому что длинные повторы её проходят. Итог: 1 325 748 строк (43 % базы),
# ~43 000 новых в час, valid=1 — НОЛЬ за всю историю; в выборке «K00…» только заглушки вида
# `K0000…0111111111222222` и блобы по 300 символов. Ключевое слово `K` вдобавок заставляло
# trufflehog сканировать почти каждый файл.
# Строгий вариант (включать, только если появится настоящий образец B2-ключа): требовать
# контекст переменной и точную длину — 25 символов, только верхний регистр, без `ss://`/base64:
# - name: backblaze
#   keywords:
#   - B2_APPLICATION_KEY
#   - BACKBLAZE_APPLICATION_KEY
#   - applicationKeyId
#   regex:
#     pattern: (?:B2_APPLICATION_KEY_ID|applicationKeyId)[\s'"=:]+(K00[0-9A-Za-z]{22})\b
#   entropy: 4.0
